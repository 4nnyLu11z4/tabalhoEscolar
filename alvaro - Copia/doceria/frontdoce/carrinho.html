
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Carrinho | Encanto de mel</title>

    <link rel="stylesheet" href="carrinho.css">
    <script src="carrinho.js" defer></script>
</head>

<body>

    <header class="topbar">

        <a href="index.html" class="brand">
            <span class="brand-icon">🧁</span>

            <div>
                <strong>Encanto de mel</strong>
                <small>doces que iluminam seu dia ♡</small>
            </div>
        </a>

        <nav>
            <a href="index.html">Início</a>
        </nav>

        <div class="cart">
            🛒 <span id="cart-count">0</span>
        </div>

    </header>


    <main>

        <section class="page-title">

            <h1>Meu carrinho ♡</h1>

            <p>
                Confira seus doces antes de finalizar.
            </p>

        </section>


        <section class="cart-container">

            <div class="cart-products">

                <h2>Seus produtos</h2>

                <div id="cart-items">

                    <!-- Produtos inseridos pelo JavaScript -->

                </div>

            </div>


            <aside class="cart-summary">

                <h2>Resumo da compra</h2>

                <div class="summary-line">
                    <span>Quantidade de itens:</span>
                    <strong id="total-items">0</strong>
                </div>

                <div class="summary-line total">
                    <span>Total:</span>
                    <strong id="total-price">R$ 0,00</strong>
                </div>

                <a href="index.html#cardapio" class="continue-button">
                    Continuar comprando
                </a>

            </aside>

        </section>

    </main>


    <footer>

        <div class="footer-brand">
            🧁

            <div>
                <strong>Encanto de mel</strong>
                <small>Espalhando doçura em cada pedacinho ♡</small>
            </div>
        </div>
    </footer>

</body>
</html>
